<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
<title id="title">All Aboard village layout</title>
<desc id="desc">A shared village for both chapters. Hana, Sora, and Fumi are north of the festival square. Taro is west and Yuki east. Momo, the arrival pier, and Kiko are south. Paths connect the locations around the player’s stall.</desc>
<rect width="960" height="480" rx="22" fill="#FAF9F4"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
<text x="38" y="42" font-size="15" font-weight="600" letter-spacing="2" fill="#506656">VILLAGE LAYOUT</text>
<text x="922" y="42" text-anchor="end" font-size="14" fill="#526358">One world for both chapters</text>
<g stroke="#D7C7A9" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M170 132 L170 260 L480 260 L790 260 L790 132"/>
<path d="M480 132 L480 390"/>
<path d="M170 390 L170 260 M790 390 L790 260"/>
</g>
