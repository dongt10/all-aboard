<text x="790" y="141" text-anchor="middle" font-size="16" fill="#304B3D">Writing booth</text>
<text x="790" y="164" text-anchor="middle" font-size="13" fill="#526358">Writing</text>
<rect x="44" y="212" width="252" height="96" rx="14" fill="#E9F0E9" stroke="#C4D3C7"/>
