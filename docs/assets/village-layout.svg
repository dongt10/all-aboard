<text x="170" y="269" text-anchor="middle" font-size="16" fill="#304B3D">Workshop</text>
<text x="170" y="292" text-anchor="middle" font-size="13" fill="#526358">Math</text>
<rect x="354" y="212" width="252" height="96" rx="14" fill="#F2E5BF" stroke="#C5AB69"/>
<text x="480" y="244" text-anchor="middle" font-size="20" font-weight="700" fill="#243F31">Festival square</text>
<text x="480" y="269" text-anchor="middle" font-size="16" fill="#304B3D">Player’s stall</text>
<text x="480" y="292" text-anchor="middle" font-size="13" fill="#526358">Your creations</text>
